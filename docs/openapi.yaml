components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Access token opaco de curta duração; não é JWT.
  requestBodies:
    EmailRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - email
            properties:
              email:
                type: string
                format: email
  responses:
    UserResponse:
      description: Perfil permitido do usuário, sem papel administrativo, hashes ou tokens.
      content:
        application/json:
          schema:
            type: object
            required:
            - user
            properties:
              user:
                $ref: '#/components/schemas/User'
    TokenResponse:
      description: Novas credenciais; substitua as credenciais anteriores de forma conjunta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenPair'
    InstructionsResponse:
      description: Solicitação aceita sem confirmar a existência do cadastro.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Se os dados forem válidos, você receberá as instruções.
    ValidationError:
      description: Entrada inválida ou token de propósito inválido, expirado ou já consumido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthenticationError:
      description: Credenciais inválidas, expiradas, revogadas ou insuficientes para autenticação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Recurso indisponível no escopo do usuário autenticado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimitError:
      description: Limite de requisições excedido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        Retry-After:
          description: Período do limitador atingido em segundos; respeite a espera antes de repetir.
          schema:
            type: integer
            minimum: 1
    BadRequestError:
      description: Estrutura JSON inválida ou parâmetro obrigatório ausente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLargeError:
      description: O corpo excede o limite de 32 KiB (32768 bytes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaTypeError:
      description: POST e PATCH exigem Content-Type application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Acesso negado, conta bloqueada ou MFA adicional necessário.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflito de idempotência ou estado da operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Dependência temporariamente indisponível.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Erro HTTP400; ver error.code e error.message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Erro HTTP401; ver error.code e error.message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Erro HTTP404; ver error.code e error.message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Erro HTTP429; ver error.code e error.message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Address:
      type: object
      additionalProperties: false
      required:
      - street
      - number
      - city
      - state
      - postal_code
      properties:
        street:
          type: string
          minLength: 1
          maxLength: 160
        number:
          type: string
          minLength: 1
          maxLength: 160
        city:
          type: string
          minLength: 1
          maxLength: 160
        state:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[A-Z]{2}$
          example: SP
        postal_code:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[0-9]{8}$
          example: '01001000'
    Registration:
      type: object
      additionalProperties: false
      required:
      - full_name
      - cpf
      - birth_date
      - email
      - phone
      - address
      - profession
      - monthly_salary_cents
      - password
      - password_confirmation
      properties:
        full_name:
          type: string
          maxLength: 150
        cpf:
          type: string
          writeOnly: true
          description: CPF de teste com dígitos verificadores válidos; não representa verificação de identidade.
        birth_date:
          type: string
          format: date
          description: Entre 1900-01-01 e a data correspondente a 18 anos antes da data atual.
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{9,14}$
          example: '+5511999990000'
          description: Telefone no formato internacional E.164.
        address:
          $ref: '#/components/schemas/Address'
        profession:
          type: string
          maxLength: 120
        monthly_salary_cents:
          $ref: '#/components/schemas/Cents'
        other_income_cents:
          allOf:
          - $ref: '#/components/schemas/Cents'
          default: 0
        monthly_expenses_cents:
          allOf:
          - $ref: '#/components/schemas/Cents'
          default: 0
        existing_debts_cents:
          allOf:
          - $ref: '#/components/schemas/Cents'
          default: 0
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: Senha de 12 a 128 caracteres e no máximo 512 bytes; confirmação deve coincidir.
        password_confirmation:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: Senha de 12 a 128 caracteres e no máximo 512 bytes; confirmação deve coincidir.
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{9,14}$
          example: '+5511999990000'
          description: Telefone no formato internacional E.164.
        address:
          $ref: '#/components/schemas/Address'
        profession:
          type: string
          maxLength: 120
        monthly_salary_cents:
          $ref: '#/components/schemas/Cents'
        other_income_cents:
          $ref: '#/components/schemas/Cents'
        monthly_expenses_cents:
          $ref: '#/components/schemas/Cents'
        existing_debts_cents:
          $ref: '#/components/schemas/Cents'
    Cents:
      type: integer
      format: int64
      minimum: 0
      maximum: 9000000000000000
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - full_name
      - cpf
      - email
      - birth_date
      - phone
      - address
      - profession
      - monthly_salary_cents
      - other_income_cents
      - monthly_expenses_cents
      - existing_debts_cents
      - income_commitment_percent
      - investor_profile
      - status
      - email_verified
      - created_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        cpf:
          type: string
          readOnly: true
          pattern: ^\*{3}\.\*{3}\.\*{3}-[0-9]{2}$
          example: '***.***.***-25'
          description: CPF mascarado; somente os dois últimos dígitos são retornados.
        email:
          type: string
          format: email
          maxLength: 254
        birth_date:
          type: string
          format: date
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{9,14}$
          example: '+5511999990000'
          description: Telefone no formato internacional E.164.
        address:
          $ref: '#/components/schemas/Address'
        profession:
          type: string
          maxLength: 120
        monthly_salary_cents:
          $ref: '#/components/schemas/Cents'
        other_income_cents:
          $ref: '#/components/schemas/Cents'
        monthly_expenses_cents:
          $ref: '#/components/schemas/Cents'
        existing_debts_cents:
          $ref: '#/components/schemas/Cents'
        income_commitment_percent:
          type: string
          description: Percentual calculado no servidor, serializado como decimal exato em texto.
          example: '35.0'
        investor_profile:
          type: string
          description: Não equivale a recomendação ou questionário implementado; módulo previsto na Fase 5.
          enum:
          - not_assessed
          - conservative
          - moderate
          - aggressive
        status:
          type: string
          readOnly: true
          enum:
          - active
          - blocked
          - deactivated
        email_verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        role:
          type: string
          enum:
          - customer
          - admin
        mfa_enabled: *id008
    TokenPair:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          description: Credencial opaca com validade de 15 minutos.
        refresh_token:
          type: string
          description: Credencial opaca rotacionável; validade de 30 dias.
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          enum:
          - 900
          description: Validade do access token em segundos.
    Session:
      type: object
      additionalProperties: false
      required:
      - id
      - created_at
      - last_used_at
      - expires_at
      - current
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
    Message:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              oneOf:
              - type: array
                items:
                  type: string
              - type: object
                additionalProperties: true
    JsonObject:
      type: object
      additionalProperties: true
    Account:
      type: object
      properties:
        id: *id002
        number:
          type: string
          example: 123456789-0
        branch:
          type: string
          enum:
          - '0001'
        status:
          type: string
          enum:
          - active
          - blocked
          - closed
        available_cents:
          $ref: '#/components/schemas/Cents'
        blocked_cents:
          $ref: '#/components/schemas/Cents'
        daily_limit_cents:
          $ref: '#/components/schemas/Cents'
        created_at: *id009
      required:
      - id
      - number
      - branch
      - status
      - available_cents
      - blocked_cents
      - daily_limit_cents
    Transaction:
      type: object
      properties:
        id: *id002
        kind:
          type: string
          enum:
          - deposit
          - withdrawal
          - transfer
          - reversal
        amount_cents:
          type: integer
          format: int64
          minimum: 1
          maximum: 9000000000000000
        description:
          type: string
          maxLength: 160
        status:
          type: string
          enum:
          - posted
        direction:
          type: string
          enum:
          - debit
          - credit
          nullable: true
        completed_at: *id009
        created_at: *id009
        reverses_id:
          type: string
          format: uuid
          nullable: true
        reversed_by_id:
          type: string
          format: uuid
          nullable: true
        source_account_number:
          type: string
        destination_account_number:
          type: string
      required:
      - id
      - kind
      - amount_cents
      - status
    Receipt:
      allOf:
      - $ref: '#/components/schemas/Transaction'
      - type: object
        properties:
          simulation: *id008
          currency:
            type: string
            enum:
            - BRL
          institution:
            type: string
          account_number:
            type: string
          branch:
            type: string
          reference: *id002
    ScheduledTransfer:
      type: object
      properties:
        id: *id002
        amount_cents:
          type: integer
          format: int64
          minimum: 1
          maximum: 9000000000000000
        destination_account_number:
          type: string
        description:
          type: string
        scheduled_at: *id009
        status:
          type: string
          enum:
          - pending
          - completed
          - cancelled
          - failed
        failure_code:
          type: string
          nullable: true
        ledger_transaction_id:
          type: string
          format: uuid
          nullable: true
        created_at: *id009
    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int64
          minimum: 1
          maximum: 9000000000000000
        total_pages:
          type: integer
          format: int64
          minimum: 0
          maximum: 9000000000000000
        total_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 9000000000000000
        per_page:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
    Notification:
      type: object
      properties:
        id: *id002
        kind:
          type: string
        title:
