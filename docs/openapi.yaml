openapi: 3.0.3
info:
  title: Aurora — API bancária de simulação
  version: 1.0.0
  description: API REST com dinheiro fictício. Inclui identidade, MFA, partidas dobradas, crédito e investimentos
    educativos, administração e XLSX. Não executa operações financeiras reais. A web utiliza BFF e cookies
    HttpOnly; clientes diretos usam Bearer.
servers:
- url: http://localhost:3001
  description: Desenvolvimento local; produção exige TLS e revisão independente.
tags:
- name: Saúde
- name: Autenticação
- name: Perfil
- name: Sessões
- name: Contas
- name: Movimentações
- name: Agendamentos
- name: Dashboard
- name: Notificações
- name: Crédito
- name: Investimentos
- name: Objetivos
- name: Segurança
- name: Administração
security:
- bearerAuth: []
paths:
  /up:
    get:
      tags:
      - Saúde
      operationId: liveness
      summary: Verifica se o processo Rails responde
      description: Resposta do endpoint nativo de saúde do Rails; não verifica dependências.
      security: []
      responses:
        '200':
          description: Processo disponível.
          content:
            text/html:
              schema:
                type: string
        '500':
          description: Processo não saudável.
  /api/v1/health:
    get:
      tags:
      - Saúde
      operationId: readiness
      summary: Verifica conexão com PostgreSQL e Redis
      security: []
      responses:
        '200':
          description: Dependências disponíveis.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - simulation
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  simulation:
                    type: boolean
                    enum:
                    - true
        '503':
          description: Uma dependência necessária está indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/register:
    post:
      tags:
      - Autenticação
      operationId: register
      summary: Cadastra um usuário fictício
      description: Valida idade mínima, CPF, identidade, renda em centavos e unicidade. O cadastro não cria
        uma conta bancária. O e-mail deve ser verificado antes do login. Papel, status, hashes e campos de
        sessão não são atributos de cadastro público. O resultado de unicidade ainda pode revelar a existência
        de um cadastro; risco residual sujeito a auditoria.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - user
              properties:
                user:
                  $ref: '#/components/schemas/Registration'
      responses:
        '201':
          $ref: '#/components/responses/UserResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
  /api/v1/auth/login:
    post:
      tags:
      - Autenticação
      operationId: login
      summary: Inicia uma sessão para um usuário ativo com e-mail verificado
      description: Credenciais inválidas e e-mail não verificado recebem erro genérico de autenticação.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
                otp_code:
                  type: string
                  pattern: ^[0-9]{6}$
                recovery_code:
                  type: string
                  pattern: ^[0-9a-f]{32}$
      responses:
        '200':
          $ref: '#/components/responses/TokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Autenticação
      operationId: refresh
      summary: Rotaciona as credenciais de uma sessão
      description: O refresh token só pode ser usado uma vez. O cliente deve substituir ambos os tokens. Replay
        revoga a família da sessão, inclusive suas credenciais atuais. Evite renovações paralelas com o mesmo
        token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
                  writeOnly: true
      responses:
        '200':
          $ref: '#/components/responses/TokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
  /api/v1/auth/logout:
    delete:
      tags:
      - Autenticação
      operationId: logout
      summary: Revoga a sessão autenticada
      responses:
        '204':
          description: Sessão revogada; resposta sem corpo.
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /api/v1/auth/email_verifications:
    post:
      tags:
      - Autenticação
      operationId: requestEmailVerification
      summary: Solicita instruções de confirmação de e-mail
      description: Responde de forma genérica, sem revelar se o endereço está cadastrado.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/InstructionsResponse'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
    patch:
      tags:
      - Autenticação
      operationId: confirmEmail
      summary: Confirma e-mail com um token de uso único
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - token
              properties:
                token:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: E-mail confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: E-mail verificado.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
  /api/v1/auth/password_resets:
    post:
      tags:
      - Autenticação
      operationId: requestPasswordReset
      summary: Solicita instruções para redefinir a senha
      description: Responde de forma genérica, sem revelar se o endereço está cadastrado.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/InstructionsResponse'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
    patch:
      tags:
      - Autenticação
      operationId: resetPassword
      summary: Redefine senha com um token de uso único
      description: A redefinição válida revoga as sessões anteriores.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - token
              - password
              - password_confirmation
              properties:
                token:
                  type: string
                  writeOnly: true
                password:
                  type: string
                  format: password
                  writeOnly: true
                password_confirmation:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        '200':
          description: Senha redefinida e sessões anteriores revogadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Senha atualizada.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
  /api/v1/me:
    get:
      tags:
      - Perfil
      operationId: showCurrentUser
      summary: Consulta o perfil do usuário autenticado
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
    patch:
      tags:
      - Perfil
      operationId: updateCurrentUser
      summary: Atualiza os campos permitidos do próprio perfil
      description: CPF, e-mail e data de nascimento são imutáveis na Fase 1. Role, status, credenciais e identidade
        de proprietário não são campos editáveis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - user
              properties:
                user:
                  $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
    delete:
      tags:
      - Perfil
      operationId: deactivateCurrentUser
      summary: Desativa o usuário e revoga suas sessões
      description: Desativação é mudança de estado; não representa eliminação integral de dados pessoais.
      responses:
        '204':
          description: Usuário desativado; resposta sem corpo.
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /api/v1/sessions:
    get:
      tags:
      - Sessões
      operationId: listCurrentUserSessions
      summary: Lista metadados das sessões do próprio usuário
      responses:
        '200':
          description: Sessões no escopo do usuário autenticado; tokens e hashes não são expostos.
          content:
            application/json:
              schema:
                type: object
                required:
                - sessions
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /api/v1/sessions/{id}:
    delete:
      tags:
      - Sessões
      operationId: revokeCurrentUserSession
      summary: Revoga uma sessão pertencente ao usuário autenticado
      description: Identificadores inexistentes ou pertencentes a outro usuário recebem HTTP 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Sessão revogada; resposta sem corpo.
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/account:
    get:
      tags:
      - Contas
      operationId: get_account
      summary: Consulta a própria conta
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - Contas
      operationId: post_account
      summary: Abre uma conta fictícia por cliente
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/account/deposits:
    post:
      tags:
      - Movimentações
      operationId: post_account_deposits
      summary: Depósito fictício
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_cents:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9000000000000000
                description:
                  type: string
                  maxLength: 160
              required:
              - amount_cents
  /api/v1/account/withdrawals:
    post:
      tags:
      - Movimentações
      operationId: post_account_withdrawals
      summary: Saque fictício
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_cents:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9000000000000000
                description:
                  type: string
                  maxLength: 160
              required:
              - amount_cents
  /api/v1/account/block:
    post:
      tags:
      - Contas
      operationId: post_account_block
      summary: Bloqueia preventivamente a própria conta
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/account/close:
    post:
      tags:
      - Contas
      operationId: post_account_close
      summary: Encerra a própria conta vazia, sem agendamentos pendentes
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/transfers:
    post:
      tags:
      - Movimentações
      operationId: post_transfers
      summary: Transfere dinheiro fictício atomicamente entre contas
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: JSON obrigatório, no máximo32768bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                destination_account_number: &id003
                  type: string
                  maxLength: 20
                amount_cents: &id004
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9000000000000000
                description: &id005
                  type: string
                  maxLength: 160
              required:
              - destination_account_number
              - amount_cents
  /api/v1/transactions:
    get:
      tags:
      - Movimentações
      operationId: get_transactions
      summary: Extrato próprio com filtros e paginação
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Período máximo366dias; padrão últimos30dias.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 999999
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - deposit
          - withdrawal
          - transfer
          - reversal
      - name: from
        in: query
        required: false
        schema: &id001
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema: *id001
  /api/v1/transactions/{id}:
    get:
      tags:
      - Movimentações
      operationId: get_transactions_id
      summary: Consulta movimentação pertencente à conta
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
