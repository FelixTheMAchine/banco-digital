# Ambiente LOCAL. Não publicar estes serviços diretamente na Internet.
name: banco-digital

x-backend: &backend
  build:
    context: ./backend
  image: banco-digital-backend:development
  init: true
  volumes:
    - ./backend:/app
  environment: &backend-environment
    RAILS_ENV: development
    DATABASE_URL: postgresql://${POSTGRES_USER:?Execute scripts/setup}:${POSTGRES_PASSWORD:?Execute scripts/setup}@postgres:5432/${POSTGRES_DB:-banco_digital_development}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Execute scripts/setup}
    APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3000}
    APP_HOSTS: ${APP_HOSTS:-localhost,127.0.0.1,api,10.0.2.2}
    APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
    MAIL_FROM: ${MAIL_FROM:-nao-responda@banco-digital.example}
    RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
    RUN_DEMO_SEEDS: ${RUN_DEMO_SEEDS:-0}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Execute scripts/setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/setup}
      POSTGRES_DB: ${POSTGRES_DB:-banco_digital_development}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    <<: *backend
    command:
      - bash
      - -lc
      - rm -f tmp/pids/server.pid && bundle exec rails db:prepare && exec bundle exec rails server --binding 0.0.0.0 --port 3001
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3001/up"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  worker:
    <<: *backend
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *backend
    command: ["bundle", "exec", "rails", "runner", "Banking::Scheduler.run!"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: banco-digital-web:development
    build:
      context: ./web
    environment:
      API_URL: http://api:3001
      SITE_URL: http://localhost:${WEB_PORT:-3000}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      NODE_ENV: production
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  test:
    <<: *backend
    profiles: ["test"]
    environment:
      <<: *backend-environment
      RAILS_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/banco_digital_test
      REDIS_URL: redis://redis:6379/1
      RUN_DEMO_SEEDS: "0"
    command: ["bash", "-lc", "bundle exec rails db:prepare && bundle exec rspec"]

volumes:
  postgres_data:
  redis_data:
