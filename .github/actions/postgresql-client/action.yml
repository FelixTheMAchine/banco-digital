name: PostgreSQL 17 client
description: Installs psql and pg_dump compatible with the test server and SQL schema.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo install -d /usr/share/postgresql-common/pgdg
        curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/banco-pgdg.asc
        sudo install -m 0644 /tmp/banco-pgdg.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        . /etc/os-release
        printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y postgresql-client-17
        echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
